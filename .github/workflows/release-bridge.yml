name: Publish yade-mcp-bridge

on:
  push:
    tags:
      - "bridge-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi-bridge
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tags
        run: git fetch --tags --force
      - uses: astral-sh/setup-uv@v6
      - run: cd yade-mcp-bridge && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: yade-mcp-bridge/dist/
      - name: Extract tag annotation body
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag_body.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: tag_body.txt
          generate_release_notes: true
          files: yade-mcp-bridge/dist/*
