name: Publish yade-mcp-bridge

on:
  push:
    tags:
      - "bridge-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi-bridge
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd yade-mcp-bridge && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: yade-mcp-bridge/dist/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tags
        run: git fetch --tags --force
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$NOTES" ]; then
            gh release create "$TAG" --generate-notes
          else
            gh release create "$TAG" --notes "$NOTES"
          fi
