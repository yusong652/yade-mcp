name: Publish yade-mcp

on:
  push:
    tags:
      - "v*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check src/
      - run: uv run mypy src/yade_mcp/

  publish:
    needs: lint
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tags
        run: git fetch --tags --force
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Extract tag annotation body
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag_body.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: tag_body.txt
          generate_release_notes: true
          files: dist/*
