[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yade-mcp-bridge"
dynamic = ["version"]
description = "HTTP + SSE bridge for YADE MCP server - runs inside YADE Python environment"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name= "Yusong Han", email = "yusong.han.652@gmail.com" }]
# Zero runtime dependencies: the transport is stdlib http.server + SSE.
dependencies = []
readme = "README.md"

[project.scripts]
yade-mcp-bridge = "yade_mcp_bridge.__main__:main"

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = [
    "E501",
    "SIM105",
    "SIM102",
    "SIM103",
    "SIM108",
    "N806",
    "N802",  # lowerCamelCase functions/methods, matching yade trunk's convention (prog.rst)
    "N803",  # lowerCamelCase parameters, same convention
    "N815",  # lowerCamelCase class-scope variables, same convention
    "N816",  # lowerCamelCase module-scope variables, same convention
    "N999",  # camelCase module filenames (yade trunk precedent: libVersions.py)
    "B008",
    "B905",
    "SIM115", # FileBuffer manages its own file handle lifecycle
    "UP009",  # keep the `# encoding: utf-8` header to match yade trunk's file convention
]

[tool.hatch.version]
path = "src/yade_mcp_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yade_mcp_bridge"]
